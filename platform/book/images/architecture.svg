<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 790" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Governed analytics platform — reference architecture</title>
  <desc id="d">Sources flow through ingestion into a DuckDB warehouse with bronze, silver and gold layers, through a data-test gate, into governed access (semantic layer, vector index, catalogue) and out to serving targets. An operations and security plane runs underneath every layer.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6DB5"/></marker>
    <marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C2410C"/></marker>
    <style>
      .lane{fill:#EEF1F6;stroke:#0B2C55;stroke-width:1.2}
      .hdr{font-size:15px;font-weight:700;fill:#0B2C55;letter-spacing:.06em}
      .box{fill:#FFFFFF;stroke:#94A3B8;stroke-width:1}
      .bt{font-size:12.5px;fill:#1E293B}
      .bs{font-size:11px;fill:#475569}
      .ar{stroke:#2F6DB5;stroke-width:1.8;fill:none;marker-end:url(#a)}
      .arf{stroke:#C2410C;stroke-width:1.8;fill:none;stroke-dasharray:5 4;marker-end:url(#af)}
      .dash{stroke:#64748B;stroke-width:1.3;fill:none;stroke-dasharray:4 4;marker-end:url(#a)}
      .num{font-size:11px;font-weight:700;fill:#fff}
    </style>
  </defs>
  <rect width="1400" height="790" fill="#FFFFFF"/>

  <!-- ============ LANE BACKGROUNDS ============ -->
  <rect class="lane" x="12" y="14" width="228" height="520" rx="12"/>
  <rect class="lane" x="252" y="14" width="138" height="520" rx="12"/>
  <rect class="lane" x="402" y="14" width="452" height="520" rx="12"/>
  <rect class="lane" x="866" y="14" width="132" height="520" rx="12"/>
  <rect class="lane" x="1010" y="14" width="176" height="520" rx="12"/>
  <rect class="lane" x="1198" y="14" width="190" height="520" rx="12"/>

  <g text-anchor="middle">
    <circle cx="44" cy="40" r="11" fill="#0B2C55"/><text class="num" x="44" y="44">1</text>
    <text class="hdr" x="138" y="45">SOURCES</text>
    <circle cx="268" cy="40" r="11" fill="#0B2C55"/><text class="num" x="268" y="44">2</text>
    <text class="hdr" x="330" y="45">INGEST</text>
    <circle cx="436" cy="40" r="11" fill="#0B2C55"/><text class="num" x="436" y="44">3</text>
    <text class="hdr" x="636" y="45">WAREHOUSE · DuckDB</text>
    <circle cx="884" cy="40" r="11" fill="#0B2C55"/><text class="num" x="884" y="44">4</text>
    <text class="hdr" x="940" y="45">GATE</text>
    <circle cx="1028" cy="40" r="11" fill="#0B2C55"/><text class="num" x="1028" y="44">5</text>
    <text class="hdr" x="1106" y="45">GOVERN</text>
    <circle cx="1216" cy="40" r="11" fill="#0B2C55"/><text class="num" x="1216" y="44">6</text>
    <text class="hdr" x="1300" y="45">SERVE</text>
  </g>

  <!-- ============ 1 SOURCES ============ -->
  <g>
    <rect class="box" x="26" y="66" width="200" height="56" rx="7"/>
    <text class="bt" x="38" y="89">Files: CSV · Excel · Parquet</text><text class="bs" x="38" y="107">incl. messy board packs</text>
    <rect class="box" x="26" y="132" width="200" height="56" rx="7"/>
    <text class="bt" x="38" y="155">Operational databases</text><text class="bs" x="38" y="173">PostgreSQL · SQL Server · ERP</text>
    <rect class="box" x="26" y="198" width="200" height="56" rx="7"/>
    <text class="bt" x="38" y="221">Microsoft Dataverse</text><text class="bs" x="38" y="239">Dynamics 365 · Power Apps</text>
    <rect class="box" x="26" y="264" width="200" height="56" rx="7"/>
    <text class="bt" x="38" y="287">APIs &amp; SaaS</text><text class="bs" x="38" y="305">HRIS · CRM · core banking · SCADA</text>
    <rect class="box" x="26" y="330" width="200" height="56" rx="7"/>
    <text class="bt" x="38" y="348">Official &amp; open data</text><text class="bs" x="38" y="364" font-size="9.5" textLength="180" lengthAdjust="spacingAndGlyphs">World Bank · IMF · UNCTAD · Comtrade</text><text class="bs" x="38" y="378" font-size="9.5" textLength="180" lengthAdjust="spacingAndGlyphs">AfDB · NBS · CBN · Harvard Dataverse</text>
    <rect class="box" x="26" y="396" width="200" height="56" rx="7"/>
    <text class="bt" x="38" y="419">Unstructured text</text><text class="bs" x="38" y="437">reviews · complaints · tickets</text>
  </g>
  <!-- source arrows into ingest -->
  <path class="ar" d="M226,94 L262,94"/><path class="ar" d="M226,160 L262,160"/><path class="ar" d="M226,226 L262,226"/>
  <path class="ar" d="M226,292 L262,292"/><path class="ar" d="M226,358 L262,358"/><path class="ar" d="M226,424 L262,424"/>

  <!-- ============ 2 INGEST ============ -->
  <rect class="box" x="264" y="66" width="114" height="386" rx="8"/>
  <g class="bt" text-anchor="middle">
    <text x="321" y="100" font-weight="700">Connectors</text>
    <text class="bs" x="321" y="122">DBI · httr2 · readxl</text>
    <line x1="280" y1="140" x2="362" y2="140" stroke="#CBD5E1"/>
    <text x="321" y="166" font-weight="700">Inventory</text>
    <text class="bs" x="321" y="186">MD5 de-duplication</text>
    <line x1="280" y1="204" x2="362" y2="204" stroke="#CBD5E1"/>
    <text x="321" y="230" font-weight="700">Lineage</text>
    <text class="bs" x="321" y="250">_source_file</text>
    <text class="bs" x="321" y="266">_loaded_at</text>
    <line x1="280" y1="284" x2="362" y2="284" stroke="#CBD5E1"/>
    <text x="321" y="310" font-weight="700">Incremental</text>
    <text class="bs" x="321" y="330">new periods only</text>
    <line x1="280" y1="348" x2="362" y2="348" stroke="#CBD5E1"/>
    <text x="321" y="374" font-weight="700">Schema drift</text>
    <text class="bs" x="321" y="394">detect · don't break</text>
  </g>
  <path class="ar" d="M378,259 L420,259"/>

  <!-- ============ 3 WAREHOUSE (medallion) ============ -->
  <!-- cylinder helper: ellipse top + rect + ellipse bottom -->
  <g>
    <path d="M422,96 v300 a58,14 0 0 0 116,0 v-300" fill="#E9DCC4" stroke="#8A6D3B"/>
    <ellipse cx="480" cy="96" rx="58" ry="14" fill="#F5ECDD" stroke="#8A6D3B"/>
    <text x="480" y="138" text-anchor="middle" font-size="15" font-weight="700" fill="#6B4F1D">BRONZE</text>
    <text x="480" y="160" text-anchor="middle" class="bs">raw, as landed</text>
    <text x="480" y="176" text-anchor="middle" class="bs">1 table per source</text>
    <text x="480" y="192" text-anchor="middle" class="bs">all text · append-only</text>
    <text x="480" y="232" text-anchor="middle" class="bs" font-style="italic">"what arrived"</text>
  </g>
  <path class="ar" d="M540,259 L566,259"/>
  <g>
    <path d="M570,96 v300 a58,14 0 0 0 116,0 v-300" fill="#DDE3EA" stroke="#64748B"/>
    <ellipse cx="628" cy="96" rx="58" ry="14" fill="#EEF2F6" stroke="#64748B"/>
    <text x="628" y="138" text-anchor="middle" font-size="15" font-weight="700" fill="#334155">SILVER</text>
    <text x="628" y="160" text-anchor="middle" class="bs">typed · cleaned</text>
    <text x="628" y="176" text-anchor="middle" class="bs">de-duplicated</text>
    <text x="628" y="192" text-anchor="middle" class="bs">conformed codes</text>
    <text x="628" y="208" text-anchor="middle" class="bs">history (SCD2)</text>
    <text x="628" y="232" text-anchor="middle" class="bs" font-style="italic">"what is true"</text>
  </g>
  <path class="ar" d="M688,259 L714,259"/>
  <g>
    <path d="M718,96 v300 a58,14 0 0 0 116,0 v-300" fill="#F6E3B4" stroke="#B7791F"/>
    <ellipse cx="776" cy="96" rx="58" ry="14" fill="#FBF0D3" stroke="#B7791F"/>
    <text x="776" y="138" text-anchor="middle" font-size="15" font-weight="700" fill="#8A5A00">GOLD</text>
    <text x="776" y="160" text-anchor="middle" class="bs">facts &amp; dimensions</text>
    <text x="776" y="176" text-anchor="middle" class="bs">star schemas</text>
    <text x="776" y="192" text-anchor="middle" class="bs">business marts</text>
    <text x="776" y="232" text-anchor="middle" class="bs" font-style="italic">"what we decide on"</text>
  </g>
  <text x="628" y="452" text-anchor="middle" class="bs">one engine · one file · SQL + R · columnar &amp; fast</text>
  <text x="628" y="470" text-anchor="middle" class="bs">(graduates to MotherDuck · Fabric · Snowflake · BigQuery)</text>

  <!-- ============ 4 GATE ============ -->
  <path class="ar" d="M836,259 L878,259"/>
  <polygon points="932,196 984,259 932,322 880,259" fill="#0B2C55"/>
  <text x="932" y="254" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">DATA</text>
  <text x="932" y="270" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">TESTS</text>
  <text x="932" y="110" text-anchor="middle" class="bs">unique · not null</text>
  <text x="932" y="126" text-anchor="middle" class="bs">accepted values</text>
  <text x="932" y="142" text-anchor="middle" class="bs">relationships</text>
  <text x="932" y="158" text-anchor="middle" class="bs">freshness · volume</text>
  <text x="932" y="174" text-anchor="middle" class="bs">reconciliation</text>
  <!-- fail path -->
  <path class="arf" d="M932,322 L932,384"/>
  <rect x="878" y="388" width="108" height="64" rx="7" fill="#FFF1E6" stroke="#C2410C"/>
  <text x="932" y="410" text-anchor="middle" font-size="12" font-weight="700" fill="#9A3412">FAIL → alert</text>
  <text x="932" y="426" text-anchor="middle" class="bs">keep last good</text>
  <text x="932" y="441" text-anchor="middle" class="bs">version live</text>
  <text x="962" y="222" font-size="10" font-weight="700" fill="#2F6DB5">PASS</text>

  <!-- pass bus -->
  <path class="ar" d="M984,259 L1020,259"/>
  <path d="M1004,120 L1004,400" stroke="#2F6DB5" stroke-width="1.8"/>
  <path class="ar" d="M1004,124 L1022,124"/><path class="ar" d="M1004,262 L1022,262"/><path class="ar" d="M1004,396 L1022,396"/>

  <!-- ============ 5 GOVERN ============ -->
  <rect class="box" x="1024" y="74" width="150" height="104" rx="8"/>
  <text class="bt" x="1099" y="100" text-anchor="middle" font-weight="700">Semantic layer</text>
  <text class="bs" x="1099" y="120" text-anchor="middle">metrics.yml</text>
  <text class="bs" x="1099" y="136" text-anchor="middle">one definition of</text>
  <text class="bs" x="1099" y="152" text-anchor="middle">every KPI · owner</text>
  <text class="bs" x="1099" y="168" text-anchor="middle">→ compiled SQL</text>
  <rect class="box" x="1024" y="212" width="150" height="100" rx="8"/>
  <text class="bt" x="1099" y="238" text-anchor="middle" font-weight="700">Vector index</text>
  <text class="bs" x="1099" y="258" text-anchor="middle">text embeddings</text>
  <text class="bs" x="1099" y="274" text-anchor="middle">semantic search</text>
  <text class="bs" x="1099" y="290" text-anchor="middle">RAG for AI</text>
  <rect class="box" x="1024" y="346" width="150" height="100" rx="8"/>
  <text class="bt" x="1099" y="372" text-anchor="middle" font-weight="700">Catalogue</text>
  <text class="bs" x="1099" y="392" text-anchor="middle">tables · owners</text>
  <text class="bs" x="1099" y="408" text-anchor="middle">lineage · test log</text>
  <text class="bs" x="1099" y="424" text-anchor="middle">classification (PII)</text>

  <!-- govern -> serve bus -->
  <path d="M1174,126 L1192,126 M1174,262 L1192,262 M1174,396 L1192,396" stroke="#2F6DB5" stroke-width="1.8"/>
  <path d="M1192,90 L1192,470" stroke="#2F6DB5" stroke-width="1.8"/>
  <path class="ar" d="M1192,92 L1210,92"/><path class="ar" d="M1192,160 L1210,160"/><path class="ar" d="M1192,228 L1210,228"/>
  <path class="ar" d="M1192,296 L1210,296"/><path class="ar" d="M1192,364 L1210,364"/><path class="ar" d="M1192,432 L1210,432"/>

  <!-- ============ 6 SERVE ============ -->
  <rect x="1212" y="66" width="164" height="54" rx="7" fill="#0B2C55"/>
  <text x="1294" y="88" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">Quarto + Shiny</text>
  <text x="1294" y="106" text-anchor="middle" font-size="11" fill="#E8A33D">interactive dashboard</text>
  <rect class="box" x="1212" y="134" width="164" height="54" rx="7"/>
  <text class="bt" x="1294" y="156" text-anchor="middle">SQLite serving mart</text><text class="bs" x="1294" y="174" text-anchor="middle">Excel · Power BI · offline</text>
  <rect class="box" x="1212" y="202" width="164" height="54" rx="7"/>
  <text class="bt" x="1294" y="224" text-anchor="middle">PostgreSQL</text><text class="bs" x="1294" y="242" text-anchor="middle">multi-user apps · APIs</text>
  <rect class="box" x="1212" y="270" width="164" height="54" rx="7"/>
  <text class="bt" x="1294" y="292" text-anchor="middle">Microsoft Dataverse</text><text class="bs" x="1294" y="310" text-anchor="middle">Power Apps · Automate</text>
  <rect class="box" x="1212" y="338" width="164" height="54" rx="7"/>
  <text class="bt" x="1294" y="360" text-anchor="middle">AI assistant</text><text class="bs" x="1294" y="378" text-anchor="middle">text-to-SQL · RAG</text>
  <rect class="box" x="1212" y="406" width="164" height="54" rx="7"/>
  <text class="bt" x="1294" y="428" text-anchor="middle">Reports &amp; exports</text><text class="bs" x="1294" y="446" text-anchor="middle">Quarto PDF · Parquet</text>

  <!-- write-back loop: serving DBs can feed back as sources -->
  <path class="dash" d="M1376,252 C1396,252 1396,506 1300,510 L34,510 C22,510 19,500 19,488 L19,160 L24,160"/><path class="dash" d="M19,226 L24,226"/>
  <text x="700" y="503" text-anchor="middle" class="bs" font-style="italic">write-back: forms &amp; apps on PostgreSQL / Dataverse become sources on the next run — never an edit inside the warehouse</text>

  <!-- ============ OPS & SECURITY PLANE ============ -->
  <rect x="12" y="548" width="1376" height="228" rx="12" fill="#0B2C55"/>
  <text x="32" y="580" font-size="15" font-weight="700" fill="#E8A33D" letter-spacing=".06em">OPERATIONS &amp; SECURITY PLANE — runs under every layer</text>
  <g font-size="12.5" fill="#fff">
    <rect x="32" y="598" width="208" height="76" rx="8" fill="#16406F"/>
    <text x="46" y="622" font-weight="700">Orchestration</text><text x="46" y="642" fill="#C7D7EA" font-size="11">refresh.R · targets DAG</text><text x="46" y="658" fill="#C7D7EA" font-size="11">cron · launchd · GitHub Actions</text>
    <rect x="254" y="598" width="208" height="76" rx="8" fill="#16406F"/>
    <text x="268" y="622" font-weight="700">Config &amp; secrets</text><text x="268" y="642" fill="#C7D7EA" font-size="11">config.yml (where)</text><text x="268" y="658" fill="#C7D7EA" font-size="11">.Renviron / vault (who)</text>
    <rect x="476" y="598" width="208" height="76" rx="8" fill="#16406F"/>
    <text x="490" y="622" font-weight="700">Observability</text><text x="490" y="642" fill="#C7D7EA" font-size="11">ops.run_log · ops.test_log</text><text x="490" y="658" fill="#C7D7EA" font-size="11">alerts to email / Teams</text>
    <rect x="698" y="598" width="208" height="76" rx="8" fill="#16406F"/>
    <text x="712" y="622" font-weight="700">Access control</text><text x="712" y="642" fill="#C7D7EA" font-size="11">roles · least privilege</text><text x="712" y="658" fill="#C7D7EA" font-size="11">row-level security · SSO</text>
    <rect x="920" y="598" width="208" height="76" rx="8" fill="#16406F"/>
    <text x="934" y="622" font-weight="700">Privacy &amp; compliance</text><text x="934" y="642" fill="#C7D7EA" font-size="11">NDPA 2023 · GAID 2025</text><text x="934" y="658" fill="#C7D7EA" font-size="11">masking · retention · DPIA</text>
    <rect x="1142" y="598" width="226" height="76" rx="8" fill="#16406F"/>
    <text x="1156" y="622" font-weight="700">Version control &amp; CI/CD</text><text x="1156" y="642" fill="#C7D7EA" font-size="11">Git · reviews · dev → test → prod</text><text x="1156" y="658" fill="#C7D7EA" font-size="11">reproducible Quarto builds</text>
  </g>
  <text x="32" y="712" font-size="12" fill="#C7D7EA">People: data owner (business) · data steward (quality &amp; definitions) · data custodian / engineer (pipelines) · analyst (questions) · DPO (privacy)</text>
  <text x="32" y="738" font-size="12" fill="#C7D7EA">Rule of the road: data flows one way, left to right. Every number in serving can be traced back through gold → silver → bronze → the source file.</text>
  <text x="32" y="762" font-size="11" fill="#8FA9C7">Turning Data into Business Growth · Lagos Business School</text>
</svg>

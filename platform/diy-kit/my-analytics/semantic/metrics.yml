# semantic/metrics.yml: ONE definition per number. The dashboard reads only this.
model:
  table: gold.v_dashboard        # one wide gold view: a date column, breakdown columns, measures
  time: date                     # the date column used for trends and the date filter
  grain: month                   # default time grain: day | week | month | quarter | year
  dimensions: []                 # breakdown columns, e.g. [region, branch, product_category]
